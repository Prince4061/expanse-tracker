<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Settings - Wisdom Expense Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <div class="sidebar">
        <div class="brand">Wisdom School</div>
        <a href="/dashboard"><i class="fa-solid fa-border-all"></i> Dashboard</a>
        <a href="/expenses"><i class="fa-solid fa-money-bill-wave"></i> Expenses</a>
        <a href="/categories"><i class="fa-solid fa-shapes"></i> Categories</a>
        <a href="/vendors"><i class="fa-solid fa-store"></i> Vendors</a>
        <a href="/reports"><i class="fa-solid fa-chart-bar"></i> Reports</a>
        <a href="/settings" class="active"><i class="fa-solid fa-gear"></i> Settings</a>
        <a href="#" onclick="logout()"><i class="fa-solid fa-sign-out-alt"></i> Logout</a>
    </div>

    <div class="main-content">
        <h2 class="mb-4">System Settings</h2>

        <div class="row">
            <div class="col-md-6">
                <div class="card p-4 border-0 shadow-sm">
                    <form id="settingsForm" onsubmit="saveSettings(event)">
                        <h5 class="mb-3 text-primary"><i class="fa-solid fa-school me-2"></i>School Information</h5>
                        <div class="mb-3">
                            <label class="form-label text-muted">School Name</label>
                            <input type="text" class="form-control" id="schoolName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted">Contact Number</label>
                            <input type="text" class="form-control" id="schoolPhone">
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted">Address</label>
                            <textarea class="form-control" id="schoolAddress" rows="3"></textarea>
                        </div>

                        <hr class="my-4">

                        <h5 class="mb-3 text-primary"><i class="fa-solid fa-sliders me-2"></i>Preferences</h5>
                        <div class="mb-3">
                            <label class="form-label text-muted">Currency</label>
                            <input type="text" class="form-control" value="₹ INR (Indian Rupee)" readonly disabled>
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-muted">Date Format</label>
                            <input type="text" class="form-control" value="DD-MM-YYYY" readonly disabled>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Save Changes</button>
                    </form>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card p-4 border-0 shadow-sm">
                    <h5 class="mb-3 text-primary"><i class="fa-solid fa-shield-halved me-2"></i>Security</h5>
                    <div class="mb-3">
                        <label class="form-label text-muted">Current Password</label>
                        <input type="password" class="form-control" id="curPass" placeholder="••••••••">
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-muted">New Password</label>
                        <input type="password" class="form-control" id="newPass" placeholder="Enter new password">
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-muted">Confirm New Password</label>
                        <input type="password" class="form-control" id="confirmPass" placeholder="Re-enter new password">
                    </div>
                    <button class="btn btn-outline-primary" onclick="changePassword()">Update Password</button>
                </div>

                <div class="card p-4 border-0 shadow-sm mt-3">
                    <h5 class="mb-3 text-danger"><i class="fa-solid fa-triangle-exclamation me-2"></i>Danger Zone</h5>
                    <p class="text-muted small">Yeh action sabhi expenses, categories aur vendors ka data hamesha ke liye delete kar dega.</p>
                    <button class="btn btn-danger" onclick="wipeData()">
                        <i class="fa-solid fa-trash me-2"></i>Sabha Data Delete Karo
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
    <script>
        // Load saved settings
        var settings = getData('schoolSettings') || {};
        document.getElementById('schoolName').value = settings.name || 'Wisdom The Global World School';
        document.getElementById('schoolPhone').value = settings.phone || '+91 9876543210';
        document.getElementById('schoolAddress').value = settings.address || '';

        function saveSettings(e) {
            e.preventDefault();
            var s = {
                name: document.getElementById('schoolName').value,
                phone: document.getElementById('schoolPhone').value,
                address: document.getElementById('schoolAddress').value
            };
            setData('schoolSettings', s);
            alert('Settings saved successfully!');
        }

        function changePassword() {
            var cur = document.getElementById('curPass').value;
            var nw = document.getElementById('newPass').value;
            var con = document.getElementById('confirmPass').value;
            if (!cur || !nw) { alert('Please fill all password fields.'); return; }
            if (nw !== con) { alert('New passwords do not match!'); return; }
            var users = getData('users');
            var user = users.find(function(u) { return u.username === 'admin'; });
            if (!user || user.password !== cur) { alert('Current password is incorrect!'); return; }
            user.password = nw;
            setData('users', users);
            alert('Password updated successfully!');
        }

        function wipeData() {
            if (confirm("CHETAVANI: Yeh sabhi expenses, categories aur vendors delete kar dega. Kya aap sure hain?")) {
                localStorage.clear();
                window.location.href = '/login';
            }
        }
    </script>
</body>

</html>
