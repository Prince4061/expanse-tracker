<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Reports - Wisdom Expense Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <div class="sidebar">
        <div class="brand">Wisdom School</div>
        <a href="/dashboard"><i class="fa-solid fa-border-all"></i> Dashboard</a>
        <a href="/expenses"><i class="fa-solid fa-money-bill-wave"></i> Expenses</a>
        <a href="/categories"><i class="fa-solid fa-shapes"></i> Categories</a>
        <a href="/vendors"><i class="fa-solid fa-store"></i> Vendors</a>
        <a href="/reports" class="active"><i class="fa-solid fa-chart-bar"></i> Reports</a>
        <a href="/settings"><i class="fa-solid fa-gear"></i> Settings</a>
        <a href="#" onclick="logout()"><i class="fa-solid fa-sign-out-alt"></i> Logout</a>
    </div>

    <div class="main-content">
        <h2 class="mb-4">Reports &amp; Export</h2>

        <div class="card p-5 border-0 shadow-sm text-center" style="max-width: 800px; margin: 0 auto;">
            <div class="my-3">
                <i class="fa-solid fa-file-invoice-dollar fa-4x text-muted mb-4"></i>
                <h4 class="mb-3">Generate Expense Reports</h4>
                <p class="text-muted mb-4">Select the type of report you want to view or download.</p>

                <div id="alertBox" class="mb-3"></div>

                <div class="d-flex justify-content-center gap-3 flex-wrap">
                    <button class="btn btn-outline-primary px-4 py-2" onclick="showMonthly()">
                        <i class="fa-solid fa-calendar-alt me-2"></i> Monthly
                    </button>
                    <button class="btn btn-outline-primary px-4 py-2" onclick="showYearly()">
                        <i class="fa-solid fa-calendar-check me-2"></i> Yearly
                    </button>
                    <button class="btn btn-success px-4 py-2" onclick="exportExcel()">
                        <i class="fa-solid fa-file-excel me-2"></i> Export Excel
                    </button>
                    <button class="btn btn-danger px-4 py-2" onclick="alert('PDF export coming soon!')">
                        <i class="fa-solid fa-file-pdf me-2"></i> Export PDF
                    </button>
                </div>
            </div>
        </div>

        <div class="mt-4" style="max-width: 800px; margin: 0 auto;">
            <h5 id="summaryTitle">Monthly Summary</h5>
            <div class="card p-3 shadow-sm border-0">
                <table class="table mb-0">
                    <thead>
                        <tr>
                            <th id="col1Header">Month</th>
                            <th>Total Expenses</th>
                            <th>Count</th>
                        </tr>
                    </thead>
                    <tbody id="summaryTableBody">
                        <tr><td colspan="3" class="text-center text-muted">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/app.js"></script>
    <script>
        const expenses = getData('expenses');
        const categories = getData('categories');
        const vendors = getData('vendors');

        function getCategoryName(id) {
            const cat = categories.find(c => c.id == id);
            return cat ? cat.name : '-';
        }

        function getVendorName(id) {
            const ven = vendors.find(v => v.id == id);
            return ven ? ven.name : '-';
        }

        function showAlert(msg, type) {
            document.getElementById('alertBox').innerHTML =
                '<div class="alert alert-' + type + ' alert-dismissible fade show" role="alert">' +
                msg +
                '<button type="button" class="btn-close" data-bs-dismiss="alert"></button>' +
                '</div>';
        }

        function exportExcel() {
            if (expenses.length === 0) {
                showAlert('No expenses found to export. Please add expenses first from the Expenses page.', 'warning');
                return;
            }

            var headers = ['ID', 'Title', 'Amount (Rs)', 'Category', 'Vendor', 'Payment Method', 'Date', 'Notes'];
            var rows = expenses.map(function(e) {
                return [
                    e.id,
                    '"' + (e.title || '').replace(/"/g, '""') + '"',
                    parseFloat(e.amount || 0).toFixed(2),
                    '"' + getCategoryName(e.categoryId) + '"',
                    '"' + getVendorName(e.vendorId) + '"',
                    e.method || '',
                    e.date || '',
                    '"' + (e.notes || '').replace(/"/g, '""') + '"'
                ];
            });

            var csvContent = headers.join(',') + '\n';
            rows.forEach(function(row) { csvContent += row.join(',') + '\n'; });

            var BOM = '\uFEFF';
            var blob = new Blob([BOM + csvContent], { type: 'application/vnd.ms-excel;charset=utf-8;' });
            var url = URL.createObjectURL(blob);

            var a = document.createElement('a');
            a.href = url;
            a.download = 'expenses_report.csv';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            showAlert('Successfully exported ' + expenses.length + ' expense(s) to Excel!', 'success');
        }

        function showMonthly() {
            document.getElementById('summaryTitle').textContent = 'Monthly Summary';
            document.getElementById('col1Header').textContent = 'Month';

            var grouped = {};
            expenses.forEach(function(e) {
                if (!e.date) return;
                var d = new Date(e.date);
                var key = d.toLocaleString('default', { month: 'long', year: 'numeric' });
                if (!grouped[key]) grouped[key] = { total: 0, count: 0 };
                grouped[key].total += parseFloat(e.amount || 0);
                grouped[key].count++;
            });

            renderSummary(grouped);
        }

        function showYearly() {
            document.getElementById('summaryTitle').textContent = 'Yearly Summary';
            document.getElementById('col1Header').textContent = 'Year';

            var grouped = {};
            expenses.forEach(function(e) {
                if (!e.date) return;
                var key = new Date(e.date).getFullYear().toString();
                if (!grouped[key]) grouped[key] = { total: 0, count: 0 };
                grouped[key].total += parseFloat(e.amount || 0);
                grouped[key].count++;
            });

            renderSummary(grouped);
        }

        function renderSummary(grouped) {
            var tbody = document.getElementById('summaryTableBody');
            var keys = Object.keys(grouped);

            if (keys.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" class="text-center text-muted">No data found. Please add expenses first.</td></tr>';
                return;
            }

            tbody.innerHTML = '';
            keys.forEach(function(k) {
                var total = grouped[k].total.toLocaleString('en-IN', { minimumFractionDigits: 2 });
                tbody.innerHTML += '<tr>' +
                    '<td>' + k + '</td>' +
                    '<td class="fw-bold text-danger">&#8377;' + total + '</td>' +
                    '<td>' + grouped[k].count + ' expense(s)</td>' +
                    '</tr>';
            });
        }

        showMonthly();
    </script>
</body>

</html>
