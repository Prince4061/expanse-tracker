<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendors — Wisdom Expense Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <a class="brand-logo" href="/dashboard">
                <div class="brand-icon" style="background: transparent; box-shadow: none;">
                    <img src="https://i.ibb.co/RT2kxG7N/school-logo.png" alt="School Logo" style="width: 100%; height: 100%; object-fit: contain;">
                </div>
                <div class="brand-text">
                    <span class="brand-name">Wisdom School</span>
                    <span class="brand-sub">Expense Tracker</span>
                </div>
            </a>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-section-label">Main Menu</div>
            <a href="/dashboard"><i class="fa-solid fa-border-all"></i> Dashboard</a>
            <a href="/expenses"><i class="fa-solid fa-money-bill-wave"></i> Expenses</a>
            <a href="/categories"><i class="fa-solid fa-shapes"></i> Categories</a>
            <a href="/vendors" class="active"><i class="fa-solid fa-store"></i> Vendors</a>
            <div class="nav-section-label">Reports</div>
            <a href="/reports"><i class="fa-solid fa-chart-bar"></i> Reports</a>
            <div class="nav-section-label">System</div>
            <a href="/settings"><i class="fa-solid fa-gear"></i> Settings</a>
        </nav>
        <div class="sidebar-footer">
            <a href="#" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
        </div>
    </div>

    <div class="main-content">
        <div class="topbar">
            <span class="topbar-title">Vendors</span>
            <button class="btn-accent" data-bs-toggle="modal" data-bs-target="#vendorModal">
                <i class="fa-solid fa-plus"></i> Add Vendor
            </button>
        </div>

        <div class="page-body">
            <div class="chart-card">
                <div class="chart-card-header" style="justify-content:space-between;">
                    <span><i class="fa-solid fa-store"></i> Vendor Directory</span>
                    <span id="venCount" style="font-size:0.75rem;color:#8b8ba0;">0 vendors</span>
                </div>
                <div style="overflow-x:auto;">
                    <table class="table mb-0">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Vendor Name</th>
                                <th>Phone Number</th>
                                <th>GST Number</th>
                                <th style="text-align:right;">Action</th>
                            </tr>
                        </thead>
                        <tbody id="venBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Vendor Modal -->
    <div class="modal fade" id="vendorModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fa-solid fa-store me-2" style="color:#6c63ff;"></i>Add New Vendor</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Vendor Name *</label>
                        <input type="text" class="form-control" id="venName" placeholder="e.g. Ram Stationers">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Phone Number <span style="color:#8b8ba0;">(Optional)</span></label>
                        <input type="text" class="form-control" id="venPhone" placeholder="+91 XXXXX XXXXX">
                    </div>
                    <div class="mb-0">
                        <label class="form-label">GST Number <span style="color:#8b8ba0;">(Optional)</span></label>
                        <input type="text" class="form-control" id="venGST" placeholder="27AAPFU0939F1ZV">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-primary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="saveVendor()">
                        <i class="fa-solid fa-save me-1"></i> Save Vendor
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/app.js"></script>
    <script>
        const vendors = {{ vendors_json | safe }};
        const tbody = document.getElementById('venBody');
        document.getElementById('venCount').textContent = vendors.length + ' vendors';

        function render() {
            tbody.innerHTML = '';
            if (vendors.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5"><div class="empty-state"><i class="fa-solid fa-store"></i><p>No vendors found.<br>Add your first vendor!</p></div></td></tr>`;
                return;
            }
            vendors.forEach(function(v, i) {
                tbody.innerHTML += `<tr>
                    <td style="color:#8b8ba0;font-size:0.8rem;">${i+1}</td>
                    <td>
                        <div style="display:flex;align-items:center;gap:10px;">
                            <div style="width:32px;height:32px;border-radius:8px;background:rgba(108,99,255,0.15);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                                <i class="fa-solid fa-store" style="font-size:0.75rem;color:#6c63ff;"></i>
                            </div>
                            <span style="font-weight:600;">${v.name}</span>
                        </div>
                    </td>
                    <td style="color:#8b8ba0;">${v.phone || '<span style="opacity:0.4;">—</span>'}</td>
                    <td>
                        ${v.gst ? `<span style="font-family:monospace;font-size:0.8rem;background:rgba(255,255,255,0.04);padding:3px 8px;border-radius:4px;border:1px solid rgba(255,255,255,0.07);">${v.gst}</span>` : '<span style="opacity:0.4;color:#8b8ba0;">—</span>'}
                    </td>
                    <td style="text-align:right;">
                        <button class="btn btn-sm btn-danger" onclick="delVendor(${v.id})"><i class="fa-solid fa-trash"></i></button>
                    </td>
                </tr>`;
            });
        }
        render();

        window.saveVendor = async function() {
            var name = document.getElementById('venName').value.trim();
            if (!name) { alert('Vendor name required!'); return; }
            const payload = {
                name: name,
                phone: document.getElementById('venPhone').value.trim(),
                gst: document.getElementById('venGST').value.trim()
            };
            const res = await apiPost('/api/vendors', payload);
            if(res.success) {
                window.location.reload();
            } else {
                alert(res.message || 'Error saving vendor');
            }
        };

        window.delVendor = async function(id) {
            if (confirm("Yeh vendor delete karna chahte hain?")) {
                const res = await apiDelete('/api/vendors/' + id);
                if(res.success) {
                    window.location.reload();
                } else {
                    alert(res.message || 'Error deleting vendor');
                }
            }
        };
    </script>
</body>
</html>
