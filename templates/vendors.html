<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Vendors - Wisdom Expense Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <div class="sidebar">
        <div class="brand">Wisdom School</div>
        <a href="/dashboard"><i class="fa-solid fa-border-all"></i> Dashboard</a>
        <a href="/expenses"><i class="fa-solid fa-money-bill-wave"></i> Expenses</a>
        <a href="/categories"><i class="fa-solid fa-shapes"></i> Categories</a>
        <a href="/vendors" class="active"><i class="fa-solid fa-store"></i> Vendors</a>
        <a href="/reports"><i class="fa-solid fa-chart-bar"></i> Reports</a>
        <a href="/settings"><i class="fa-solid fa-gear"></i> Settings</a>
        <a href="#" onclick="logout()"><i class="fa-solid fa-sign-out-alt"></i> Logout</a>
    </div>

    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Vendors</h2>
            <button class="btn btn-primary" onclick="addVendor()">
                <i class="fa-solid fa-plus"></i> Add Vendor
            </button>
        </div>
        <div class="card p-3 border-0 shadow-sm">
            <table class="table">
                <thead>
                    <tr>
                        <th>Vendor Name</th>
                        <th>Phone Number</th>
                        <th>GST Number</th>
                        <th class="text-end">Actions</th>
                    </tr>
                </thead>
                <tbody id="venBody">
                    <!-- Populated dynamically -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
    <script>
        const vendors = getData('vendors');
        const tbody = document.getElementById('venBody');

        function render() {
            tbody.innerHTML = '';
            if (vendors.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-muted text-center">No vendors found.</td></tr>';
                return;
            }
            vendors.forEach(v => {
                tbody.innerHTML += `
                    <tr>
                        <td class="align-middle fw-bold">${v.name}</td>
                        <td class="align-middle">${v.phone || '-'}</td>
                        <td class="align-middle">${v.gst || '-'}</td>
                        <td class="text-end">
                            <button class="btn btn-sm btn-outline-danger" onclick="delVendor(${v.id})"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            });
        }
        render();

        window.addVendor = function () {
            const name = prompt("Enter Vendor Name:");
            if (name && name.trim()) {
                const phone = prompt("Enter Phone Number (Optional):");
                const gst = prompt("Enter GST Number (Optional):");
                vendors.push({ id: Date.now(), name: name.trim(), phone: phone, gst: gst });
                setData('vendors', vendors);
                render();
            }
        };

        window.delVendor = function (id) {
            if (confirm("Are you sure you want to delete this vendor?")) {
                const newData = vendors.filter(v => v.id !== id);
                setData('vendors', newData);
                window.location.reload();
            }
        };
    </script>
</body>

</html>
