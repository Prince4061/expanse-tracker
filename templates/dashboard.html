<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Dashboard - Wisdom Expense Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="brand">Wisdom School</div>
        <a href="/dashboard" class="active"><i class="fa-solid fa-border-all"></i> Dashboard</a>
        <a href="/expenses"><i class="fa-solid fa-money-bill-wave"></i> Expenses</a>
        <a href="/categories"><i class="fa-solid fa-shapes"></i> Categories</a>
        <a href="/vendors"><i class="fa-solid fa-store"></i> Vendors</a>
        <a href="/reports"><i class="fa-solid fa-chart-bar"></i> Reports</a>
        <a href="/settings"><i class="fa-solid fa-gear"></i> Settings</a>
        <a href="#" onclick="logout()"><i class="fa-solid fa-sign-out-alt"></i> Logout</a>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <h2 class="mb-4">Dashboard</h2>
        <div class="row">
            <div class="col-md-3">
                <div class="card p-3 shadow-sm border-0">
                    <h6 class="text-muted">Total Expenses</h6>
                    <h3 id="totalExp">₹0</h3>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card p-3 shadow-sm border-0">
                    <h6 class="text-muted">This Month</h6>
                    <h3 id="monthExp">₹0</h3>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card p-3 shadow-sm border-0">
                    <h6 class="text-muted">Today</h6>
                    <h3 id="todayExp">₹0</h3>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card p-3 shadow-sm border-0">
                    <h6 class="text-muted">Total Vendors</h6>
                    <h3 id="totalVendors">0</h3>
                </div>
            </div>
        </div>
        <div class="row mt-4">
            <div class="col-md-8">
                <div class="card p-3 shadow-sm border-0">
                    <h5>Monthly Trend</h5>
                    <canvas id="trendChart" height="100"></canvas>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card p-3 shadow-sm border-0">
                    <h5>Category Wise</h5>
                    <canvas id="catChart" height="200"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
    <script>
        // Populate stats dynamically
        const expenses = getData('expenses');
        const vendors = getData('vendors');

        document.getElementById('totalVendors').innerText = vendors.length;

        let total = 0;
        let today = 0;
        let month = 0;

        const now = new Date();
        const todayStr = now.toISOString().split('T')[0];
        const monthStr = todayStr.substring(0, 7);

        expenses.forEach(e => {
            const amt = parseFloat(e.amount);
            total += amt;
            if (e.date === todayStr) today += amt;
            if (e.date.startsWith(monthStr)) month += amt;
        });

        document.getElementById('totalExp').innerText = '₹' + total.toFixed(2);
        document.getElementById('monthExp').innerText = '₹' + month.toFixed(2);
        document.getElementById('todayExp').innerText = '₹' + today.toFixed(2);

        // Setup Line Chart
        const ctx = document.getElementById('trendChart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'],
                datasets: [{
                    label: 'Expenses',
                    data: [12000, 19000, 3000, 5000, 2000, month],
                    borderColor: '#3182ce',
                    tension: 0.1
                }]
            }
        });

        // Setup Doughnut Chart
        const catMap = {};
        expenses.forEach(e => {
            const cName = getData('categories').find(c => c.id == e.categoryId)?.name || 'Unknown';
            catMap[cName] = (catMap[cName] || 0) + parseFloat(e.amount);
        });
        const cCtx = document.getElementById('catChart').getContext('2d');
        new Chart(cCtx, {
            type: 'doughnut',
            data: {
                labels: Object.keys(catMap).length ? Object.keys(catMap) : ['None'],
                datasets: [{
                    data: Object.keys(catMap).length ? Object.values(catMap) : [1],
                    backgroundColor: ['#3182ce', '#38b2ac', '#ecc94b', '#f56565', '#ed64a6', '#9f7aea']
                }]
            }
        });
    </script>
</body>

</html>
