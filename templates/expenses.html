<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expenses — Wisdom Expense Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <a class="brand-logo" href="/dashboard">
                <div class="brand-icon" style="background: transparent; box-shadow: none;">
                    <img src="https://i.ibb.co/RT2kxG7N/school-logo.png" alt="School Logo" style="width: 100%; height: 100%; object-fit: contain;">
                </div>
                <div class="brand-text">
                    <span class="brand-name">Wisdom School</span>
                    <span class="brand-sub">Expense Tracker</span>
                </div>
            </a>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-section-label">Main Menu</div>
            <a href="/dashboard"><i class="fa-solid fa-border-all"></i> Dashboard</a>
            <a href="/expenses" class="active"><i class="fa-solid fa-money-bill-wave"></i> Expenses</a>
            <a href="/categories"><i class="fa-solid fa-shapes"></i> Categories</a>
            <a href="/vendors"><i class="fa-solid fa-store"></i> Vendors</a>
            <div class="nav-section-label">Reports</div>
            <a href="/reports"><i class="fa-solid fa-chart-bar"></i> Reports</a>
            <div class="nav-section-label">System</div>
            <a href="/settings"><i class="fa-solid fa-gear"></i> Settings</a>
        </nav>
        <div class="sidebar-footer">
            <a href="#" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
        </div>
    </div>

    <div class="main-content">
        <div class="topbar">
            <span class="topbar-title">Expenses</span>
            <button class="btn-accent" data-bs-toggle="modal" data-bs-target="#expenseModal">
                <i class="fa-solid fa-plus"></i> Add Expense
            </button>
        </div>

        <div class="page-body">
            <!-- Summary strip -->
            <div class="row g-3 mb-4" id="expSummaryStrip">
                <div class="col-md-4">
                    <div class="stat-card">
                        <div class="stat-label">Total Records</div>
                        <div class="stat-value" id="stripCount">0</div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="stat-card">
                        <div class="stat-label">Total Amount</div>
                        <div class="stat-value" id="stripTotal">₹0</div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="stat-card">
                        <div class="stat-label">This Month</div>
                        <div class="stat-value" id="stripMonth">₹0</div>
                    </div>
                </div>
            </div>

            <div class="chart-card">
                <div class="chart-card-header" style="justify-content:space-between;">
                    <span><i class="fa-solid fa-list"></i> All Expenses</span>
                    <span style="font-size:0.75rem;color:#8b8ba0;" id="expCount">0 records</span>
                </div>
                <div style="overflow-x:auto;">
                    <table class="table mb-0">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Title</th>
                                <th>Category</th>
                                <th>Vendor</th>
                                <th>Amount</th>
                                <th>Method</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="expenseTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Expense Modal -->
    <div class="modal fade" id="expenseModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <form id="expenseForm">
                    <div class="modal-header">
                        <h5 class="modal-title"><i class="fa-solid fa-plus me-2" style="color:#6c63ff;"></i>Add New Expense</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row g-3">
                            <div class="col-12">
                                <label class="form-label">Title *</label>
                                <input type="text" class="form-control" id="expTitle" placeholder="e.g. Electricity Bill" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Amount (₹) *</label>
                                <input type="number" class="form-control" id="expAmount" placeholder="0.00" min="0" step="0.01" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Date *</label>
                                <input type="date" class="form-control" id="expDate" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Category *</label>
                                <select class="form-select" id="expCategory" required></select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Payment Method *</label>
                                <select class="form-select" id="expMethod" required>
                                    <option value="Cash">💵 Cash</option>
                                    <option value="UPI">📱 UPI</option>
                                    <option value="Bank Transfer">🏦 Bank Transfer</option>
                                    <option value="Card">💳 Card</option>
                                </select>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Vendor (Optional)</label>
                                <select class="form-select" id="expVendor">
                                    <option value="">— None —</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-primary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="fa-solid fa-save me-1"></i> Save Expense
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/app.js"></script>
    <script>
        const expenses = {{ expenses_json | safe }};
        const categories = {{ categories_json | safe }};
        const vendors = {{ vendors_json | safe }};

        // Set default date
        document.getElementById('expDate').value = new Date().toISOString().split('T')[0];

        // Populate selects
        const catSelect = document.getElementById('expCategory');
        categories.forEach(c => catSelect.innerHTML += `<option value="${c.id}">${c.name}</option>`);
        const venSelect = document.getElementById('expVendor');
        vendors.forEach(v => venSelect.innerHTML += `<option value="${v.id}">${v.name}</option>`);

        // Summary strip
        var total = 0, monthTotal = 0;
        var monthStr = new Date().toISOString().substring(0,7);
        expenses.forEach(e => {
            total += parseFloat(e.amount||0);
            if (e.date && e.date.startsWith(monthStr)) monthTotal += parseFloat(e.amount||0);
        });
        document.getElementById('stripCount').textContent = expenses.length;
        document.getElementById('stripTotal').textContent = '₹' + total.toLocaleString('en-IN',{minimumFractionDigits:2});
        document.getElementById('stripMonth').textContent = '₹' + monthTotal.toLocaleString('en-IN',{minimumFractionDigits:2});
        document.getElementById('expCount').textContent = expenses.length + ' records';

        function methodBadge(m) {
            var cls = m === 'Cash' ? 'cash' : m === 'UPI' ? 'upi' : m === 'Card' ? 'card' : 'bank';
            return `<span class="badge-method badge-${cls}">${m}</span>`;
        }

        const tbody = document.getElementById('expenseTableBody');
        function renderTable() {
            tbody.innerHTML = '';
            if (expenses.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7">
                    <div class="empty-state"><i class="fa-solid fa-receipt"></i><p>No expenses found.<br>Click "Add Expense" to get started.</p></div>
                </td></tr>`;
                return;
            }
            const sorted = [...expenses].sort((a,b) => new Date(b.date) - new Date(a.date));
            sorted.forEach(e => {
                const cat = categories.find(c => c.id == e.categoryId)?.name || '-';
                const ven = vendors.find(v => v.id == e.vendorId)?.name || '-';
                tbody.innerHTML += `<tr>
                    <td style="color:#8b8ba0;font-size:0.82rem;">${e.date}</td>
                    <td style="font-weight:500;">${e.title}</td>
                    <td><span class="badge-cat">${cat}</span></td>
                    <td style="color:#8b8ba0;">${ven}</td>
                    <td style="font-weight:700;color:#6c63ff;">₹${parseFloat(e.amount).toLocaleString('en-IN',{minimumFractionDigits:2})}</td>
                    <td>${methodBadge(e.method)}</td>
                    <td><button class="btn btn-danger btn-sm" onclick="deleteExp(${e.id})"><i class="fa-solid fa-trash"></i></button></td>
                </tr>`;
            });
        }
        renderTable();

        document.getElementById('expenseForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            const newExp = {
                title: document.getElementById('expTitle').value,
                amount: document.getElementById('expAmount').value,
                categoryId: document.getElementById('expCategory').value,
                vendorId: document.getElementById('expVendor').value,
                date: document.getElementById('expDate').value,
                method: document.getElementById('expMethod').value
            };
            const res = await apiPost('/api/expenses', newExp);
            if(res.success) {
                window.location.reload();
            } else {
                alert(res.message || 'Error saving expense');
            }
        });

        window.deleteExp = async function(id) {
            if (confirm("Yeh expense delete karna chahte hain?")) {
                const res = await apiDelete('/api/expenses/' + id);
                if(res.success) {
                    window.location.reload();
                } else {
                    alert(res.message || 'Error deleting expense');
                }
            }
        };
    </script>
</body>
</html>
