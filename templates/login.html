<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Wisdom Expense Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="login-page">
    <div class="login-box">
        <div class="login-logo" style="background: transparent; box-shadow: none; width: 60px; height: 60px; padding: 0;">
            <img src="https://i.ibb.co/RT2kxG7N/school-logo.png" alt="School Logo" style="width: 100%; height: 100%; object-fit: contain;">
        </div>
        <h1>Wisdom Tracker</h1>
        <p>Wisdom The Global World School</p>

        <div id="loginAlert" class="alert alert-danger d-none mb-4">
            <i class="fa-solid fa-circle-exclamation me-2"></i>Username ya password galat hai.
        </div>

        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <div class="input-group">
                    <span class="input-group-text" style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);border-right:none;color:#8b8ba0;">
                        <i class="fa-solid fa-user fa-sm"></i>
                    </span>
                    <input type="text" class="form-control" id="username" placeholder="Enter username" required
                        style="border-left:none!important;border-radius:0 8px 8px 0!important;">
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text" style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);border-right:none;color:#8b8ba0;">
                        <i class="fa-solid fa-lock fa-sm"></i>
                    </span>
                    <input type="password" class="form-control" id="password" placeholder="••••••••" required
                        style="border-left:none!important;border-radius:0 8px 8px 0!important;">
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2" id="loginBtn">
                <i class="fa-solid fa-right-to-bracket me-2"></i>Login
            </button>
        </form>


    </div>

    <!-- Skip checkAuth here since backend handles redirects -->
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            var u = document.getElementById('username').value;
            var p = document.getElementById('password').value;
            var btn = document.getElementById('loginBtn');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i>Wait...';
            btn.disabled = true;
            
            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username: u, password: p})
                });
                const data = await res.json();
                if (data.success) {
                    window.location.href = '/dashboard';
                } else {
                    document.getElementById('loginAlert').innerHTML = `<i class="fa-solid fa-circle-exclamation me-2"></i>${data.message || 'Username ya password galat hai.'}`;
                    document.getElementById('loginAlert').classList.remove('d-none');
                }
            } catch(e) {
                document.getElementById('loginAlert').classList.remove('d-none');
            }
            btn.innerHTML = '<i class="fa-solid fa-right-to-bracket me-2"></i>Login';
            btn.disabled = false;
        });
    </script>
</body>
</html>
