<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login - Wisdom Expense Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body class="login-page">
    <div class="login-card text-center">
        <h3 class="mb-4">Wisdom Expense Tracker</h3>
        <div id="loginAlert" class="alert alert-danger d-none">Invalid credentials. Only admin access allowed.</div>
        <form id="loginForm">
            <div class="mb-3">
                <input type="text" class="form-control" id="username" placeholder="Username" required>
            </div>
            <div class="mb-3">
                <input type="password" class="form-control" id="password" placeholder="Password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>
    </div>

    <script src="/static/js/app.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            const valid = (u === 'admin' && p === 'admin123');
            if (valid) {
                localStorage.setItem('isLoggedIn', 'true');
                window.location.href = '/dashboard';
            } else {
                document.getElementById('loginAlert').classList.remove('d-none');
            }
        });
    </script>
</body>

</html>
