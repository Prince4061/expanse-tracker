<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login - Wisdom Expense Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body class="login-page">
    <div class="login-card text-center">
        <h3 class="mb-1">Wisdom Expense Tracker</h3>
        <p class="text-muted small mb-4">Wisdom The Global World School</p>
        <div id="loginAlert" class="alert alert-danger d-none">
            <i class="fa-solid fa-circle-exclamation me-2"></i>Username ya password galat hai.
        </div>
        <form id="loginForm">
            <div class="mb-3">
                <input type="text" class="form-control" id="username" placeholder="Username" required>
            </div>
            <div class="mb-3">
                <input type="password" class="form-control" id="password" placeholder="Password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>
    </div>

    <script src="/static/js/app.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();
            var u = document.getElementById('username').value;
            var p = document.getElementById('password').value;
            var users = JSON.parse(localStorage.getItem('users')) || [];
            var valid = users.find(function(usr) { return usr.username === u && usr.password === p; });
            if (valid) {
                localStorage.setItem('isLoggedIn', 'true');
                window.location.href = '/dashboard';
            } else {
                document.getElementById('loginAlert').classList.remove('d-none');
            }
        });
    </script>
</body>

</html>
